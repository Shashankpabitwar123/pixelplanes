services:
  - type: web
    name: pixelplanes-realtime
    runtime: node
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://pixelplanes.app
      - key: DATABASE_URL
        sync: false
