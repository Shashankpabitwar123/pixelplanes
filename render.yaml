services:
  - type: web
    name: pixelplanes-realtime
    runtime: node
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://pixelplanes.app
      - key: DATABASE_URL
        sync: false
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_TTL_SECONDS
        value: "86400"
